log_format blog '$remote_addr host=$host forwarded=$http_x_forwarded_for proto=$http_x_forwarded_proto "$request" $status $body_bytes_sent';
server {
    listen 80;
    server_name kepler452byte.tech;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout blog;
    allow 127.0.0.1;
    allow 10.11.0.1;
    allow 192.168.8.0/24;
    deny all;
    location = /healthz { access_log off; try_files /index.html =503; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
}
